<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Категория: Еда</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #fbeac5;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #2d1e3f;
      color: white;
      padding: 15px 25px;
      position: relative;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background-color: #2d1e3f;
      min-width: 160px;
      z-index: 1;
      border-radius: 8px;
    }

    .dropdown-content a {
      color: white;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      font-size: 16px;
    }

    .dropdown-content a:hover {
      background-color: #3f2f5c;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .content {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 25px;
      padding: 40px;
      text-align: center;
    }

    .card {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card p {
      margin: 0;
      padding: 15px;
      background-color: #2d1e3f;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="index.html"></a>
    <div class="dropdown">
      <a href="#">КАТЕГОРИИ</a>
      <div class="dropdown-content">
        <a href="kino.html">Кино</a>
        <a href="knigi.html">Книги</a>
        <a href="otdyh.html">Отдых</a>
        <a href="priklyucheniya.html">Приключения</a>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="card" onclick="location.href='pervye.html'">
      <img src="https://example.com/borscht.jpg" alt="Первые блюда">
      <p>ПЕРВЫЕ БЛЮДА</p>
    </div>
    <div class="card" onclick="location.href='vtorye.html'">
      <img src="https://example.com/steak.jpg" alt="Вторые блюда">
      <p>ВТОРЫЕ БЛЮДА</p>
    </div>
    <div class="card" onclick="location.href='zakuski.html'">
      <img src="https://example.com/bruschetta.jpg" alt="Закуски">
      <p>ЗАКУСКИ</p>
    </div>
    <div class="card" onclick="location.href='napitki.html'">
      <img src="https://example.com/smoothie.jpg" alt="Напитки">
      <p>НАПИТКИ</p>
    </div>
    <div class="card" onclick="location.href='deserty.html'">
      <img src="https://example.com/dessert.jpg" alt="Десерты">
      <p>ДЕСЕРТЫ</p>
    </div>
  </div>

</body>
</html>
